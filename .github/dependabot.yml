# Automatic dependency update PRs. See docs/conventions.md#dependencies.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      # One PR per week for all minor/patch updates.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Deferred majors (see docs/decisions.md, dependency policy).
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # @types/node follows the Node.js runtime major (24).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(ci)
